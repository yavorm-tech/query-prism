[project]
name = "query-prism-backend"
version = "2.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
# Real-bug rules only: syntax errors, undefined names, unused imports/variables.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Postgres + Redis (DATABASE_URL, REDIS_URL)"]

# ── Architecture contracts (lint-imports) ────────────────────────────────────
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Bounded contexts depend only downward"
type = "layers"
layers = [
    "app.retrieval",
    "app.knowledge",
    "app.workspace",
    "app.identity",
    "app.metering | app.notification | app.audit",
    "app.shared",
]
