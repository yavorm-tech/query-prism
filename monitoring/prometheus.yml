# Scrapes the app's internal metrics endpoints and evaluates alerts.yml.
# Started with the "monitoring" compose profile; see docs/architecture.md#observability.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: backup              # node-exporter textfile collector reading backups/metrics/
    static_configs:
      - targets: ["node-exporter:9100"]
